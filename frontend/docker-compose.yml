services:
  frontend:
    build: .
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    volumes:
      - asamapp-data:/app/data
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/asamapp.db?connection_limit=1
      - AUTH_ENABLED=true
      - AUTH_SECRET=${AUTH_SECRET:?AUTH_SECRET es requerido}
      - SERVE_FRONTEND=false
      - TRUST_PROXY=1
    restart: unless-stopped

volumes:
  asamapp-data:
